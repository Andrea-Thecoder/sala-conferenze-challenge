#--------------------------------------------------------------------
#            Server
#--------------------------------------------------------------------
quarkus.http.root-path=/api/v1/naxos-backend-challenge
quarkus.http.port=8080
quarkus.http.test-port=8082

#--------------------------------------------------------------------
#            CORS
#--------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Access-Control-Allow-Origin,Content-Type,Response-Type

%dev.quarkus.http.cors.origins=/.*/

#--------------------------------------------------------------------
#            Logging
#--------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.naxos.challenge"=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

#--------------------------------------------------------------------
#            Jackson
#--------------------------------------------------------------------
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.serialization.indent-output=false

#--------------------------------------------------------------------
#            Flyway
#--------------------------------------------------------------------
quarkus.flyway.migrate-at-start=false
quarkus.flyway.repair-at-start=false
quarkus.flyway.locations=dbinit/postgres

%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.repair-at-start=true
%dev.quarkus.flyway.clean-at-start=false

#--------------------------------------------------------------------
#            Hibernate ORM
#--------------------------------------------------------------------
%dev.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.scripts.generation=create
%dev.quarkus.hibernate-orm.scripts.generation.create-target=src/main/resources/dbinit/postgres/V1.0__schema.sql

#--------------------------------------------------------------------
#            JWT (SmallRye JWT) - firma e verifica locali, nessun IdP esterno
#--------------------------------------------------------------------
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://naxos-backend-challenge
smallrye.jwt.sign.key.location=privateKey.pem

# Disattivata: senza, un Bearer scaduto/malformato su un endpoint PUBBLICO (es. /auth/logout,
# che deve funzionare anche ad access token già scaduto) viene rifiutato con 401 a monte, prima
# ancora di entrare nella Resource. Con proactive=false la validazione avviene solo quando serve
# davvero (endpoint @Authenticated/@RolesAllowed, o accesso esplicito a JsonWebToken/SecurityIdentity).
quarkus.http.auth.proactive=false

auth.jwt-issuer=${mp.jwt.verify.issuer}
auth.jwt-expiration-minutes=5
auth.jwt-refresh-expiration-minutes=60
%dev.auth.jwt-issuer=sala_conferenze_issuer
%dev.auth.jwt-expiration-minutes=15

#--------------------------------------------------------------------
#            Password hashing (BCrypt)
#--------------------------------------------------------------------
auth.bcrypt-rounds=12
%dev.auth.bcrypt-rounds=10
%test.auth.bcrypt-rounds=4


#--------------------------------------------------------------------
#            OpenAPI and Swagger
#--------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=naxos-backend-challenge API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=naxos-backend-challenge REST API
quarkus.smallrye-openapi.operation-id-strategy=method
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.path=/docs/v1/openapi

%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.path=/ui/v1/openapi
%dev.quarkus.swagger-ui.doc-expansion=none
%dev.quarkus.swagger-ui.display-operation-id=true

#--------------------------------------------------------------------
#            Redis Cache
#--------------------------------------------------------------------
quarkus.redis.hosts=6379

%dev.quarkus.redis.hosts=redis://localhost:6379

#--------------------------------------------------------------------
#            Datasource
#--------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=naxos-backend-challenge
quarkus.datasource.password=secret
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/naxos-backend-challenge?currentSchema=dev,public

%dev.quarkus.datasource.username=naxos-backend-challenge
%dev.quarkus.datasource.password=secret
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/naxos-backend-challenge?currentSchema=dev
